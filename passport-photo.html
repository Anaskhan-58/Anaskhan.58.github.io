<script>

function createPhoto() {

    const input =
    document.getElementById("imageInput");

    const file =
    input.files[0];


    if (!file) {

        alert("Please select a photo.");

        return;

    }


    const size =
    document.getElementById("photoSize").value;


    let targetWidth;
    let targetHeight;


    /*
    Create a high-resolution
    output for printing.
    */


    if (size === "35x45") {

        targetWidth = 413;
        targetHeight = 531;

    }


    if (size === "2x2") {

        targetWidth = 600;
        targetHeight = 600;

    }


    if (size === "35x35") {

        targetWidth = 413;
        targetHeight = 413;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(e) {

        const img =
        new Image();


        img.onload =
        function() {

            /*
            Calculate crop area
            using the selected ratio.
            */

            const targetRatio =
            targetWidth / targetHeight;


            const imageRatio =
            img.width / img.height;


            let cropWidth =
            img.width;

            let cropHeight =
            img.height;

            let cropX = 0;

            let cropY = 0;


            if (imageRatio > targetRatio) {

                cropWidth =
                img.height * targetRatio;

                cropX =
                (img.width - cropWidth) / 2;

            } else {

                cropHeight =
                img.width / targetRatio;

                cropY =
                (img.height - cropHeight) / 2;

            }


            const canvas =
            document.createElement("canvas");


            canvas.width =
            targetWidth;

            canvas.height =
            targetHeight;


            const ctx =
            canvas.getContext("2d");


            /*
            White background
            */

            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                targetWidth,
                targetHeight
            );


            /*
            Draw cropped photo
            */

            ctx.drawImage(
                img,
                cropX,
                cropY,
                cropWidth,
                cropHeight,
                0,
                0,
                targetWidth,
                targetHeight
            );


            const output =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


            const preview =
            document.getElementById("preview");


            preview.src =
            output;


            preview.style.display =
            "block";


            const download =
            document.getElementById("download");


            download.href =
            output;


            download.style.display =
            "inline-block";


            document
            .getElementById("status")
            .innerText =
            "Passport photo created successfully!";

        };


        img.src =
        e.target.result;

    };


    reader.readAsDataURL(file);

}

</script>
