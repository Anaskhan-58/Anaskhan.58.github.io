<body>


<header>

<div class="header">

<div class="logo">
FreeDocTools
</div>

<a href="index.html">
← Home
</a>

</div>

</header>


<div class="container">

<h1>Image Resizer</h1>

<p class="subtitle">
Resize your JPG, PNG or WebP images easily.
</p>


<div class="box">

<h3>Select Image</h3>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp"
>


<div class="dimensions" id="dimensions">

<div class="dimension-row">

<div>

<label for="width">
Width (px)
</label>

<input
type="number"
id="width"
min="1"
>

</div>


<div>

<label for="height">
Height (px)
</label>

<input
type="number"
id="height"
min="1"
>

</div>

</div>


<div class="checkbox">

<label>

<input
type="checkbox"
id="keepRatio"
checked
>

Keep aspect ratio

</label>

</div>


<button onclick="resizeImage()">
Resize Image
</button>

</div>


<img id="preview">


<p id="status"></p>


<a
id="download"
download="FreeDocTools-Resized-Image.jpg">
Download Resized Image
</a>

</div>


<p class="info">

Your image is processed directly in your browser.
It is not uploaded to our server.

</p>

</div>


<footer>

© 2026 FreeDocTools

</footer>


<script>

let originalImage = new Image();

let originalRatio = 1;


document
.getElementById("imageInput")
.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();


    reader.onload = function(e) {

        originalImage.onload = function() {

            originalRatio =
            originalImage.width /
            originalImage.height;


            document
            .getElementById("width")
            .value =
            originalImage.width;


            document
            .getElementById("height")
            .value =
            originalImage.height;


            document
            .getElementById("dimensions")
            .style.display =
            "block";


            document
            .getElementById("status")
            .innerText =
            "Original size: " +
            originalImage.width +
            " × " +
            originalImage.height +
            " px";

        };


        originalImage.src = e.target.result;

    };


    reader.readAsDataURL(file);

});


document
.getElementById("width")
.addEventListener("input", function() {

    const keep =
    document.getElementById("keepRatio").checked;

    if (!keep) {
        return;
    }

    const width =
    parseInt(this.value);

    if (width > 0) {

        document
        .getElementById("height")
        .value =
        Math.round(width / originalRatio);

    }

});


document
.getElementById("height")
.addEventListener("input", function() {

    const keep =
    document.getElementById("keepRatio").checked;

    if (!keep) {
        return;
    }

    const height =
    parseInt(this.value);

    if (height > 0) {

        document
        .getElementById("width")
        .value =
        Math.round(height * originalRatio);

    }

});


function resizeImage() {

    const width =
    parseInt(
        document.getElementById("width").value
    );


    const height =
    parseInt(
        document.getElementById("height").value
    );


    if (!originalImage.src) {

        alert("Please select an image.");

        return;

    }


    if (
        !width ||
        !height ||
        width < 1 ||
        height < 1
    ) {

        alert("Please enter valid dimensions.");

        return;

    }


    const canvas =
    document.createElement("canvas");


    canvas.width = width;

    canvas.height = height;


    const ctx =
    canvas.getContext("2d");


    ctx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
    );


    const output =
    canvas.toDataURL(
        "image/jpeg",
        0.92
    );


    const preview =
    document.getElementById("preview");


    preview.src = output;

    preview.style.display =
    "block";


    const download =
    document.getElementById("download");


    download.href = output;

    download.style.display =
    "inline-block";


    status =
    document.getElementById("status");


    status.innerText =
    "Image resized successfully! " +
    width +
    " × " +
    height +
    " px";

}

</script>


</body>

</html>
