<!-- PDF LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>

async function createPDF() {

    const input =
    document.getElementById("imageInput");

    const files =
    input.files;

    if (!files || files.length === 0) {

        alert("Please select at least one image.");

        return;

    }

    const status =
    document.getElementById("status");

    status.innerText =
    "Creating PDF...";

    const { jsPDF } =
    window.jspdf;

    let pdf = null;


    for (let i = 0; i < files.length; i++) {

        const file =
        files[i];

        const dataURL =
        await readFile(file);

        const img =
        await loadImage(dataURL);


        /*
        Convert pixels to PDF points.
        1 pixel ≈ 0.75 PDF points.
        */

        const width =
        img.width * 0.75;

        const height =
        img.height * 0.75;


        /*
        Create PDF page exactly
        according to image size.
        */

        if (i === 0) {

            pdf = new jsPDF({

                orientation:
                width > height
                ? "landscape"
                : "portrait",

                unit: "pt",

                format: [
                    width,
                    height
                ]

            });

        } else {

            pdf.addPage(
                [width, height],
                width > height
                ? "landscape"
                : "portrait"
            );

        }


        /*
        Add the image from
        edge to edge.
        */

        const format =
        file.type === "image/png"
        ? "PNG"
        : "JPEG";


        pdf.addImage(
            dataURL,
            format,
            0,
            0,
            width,
            height
        );

    }


    const pdfBlob =
    pdf.output("blob");


    const url =
    URL.createObjectURL(pdfBlob);


    const download =
    document.getElementById("download");


    download.href =
    url;


    download.style.display =
    "inline-block";


    status.innerText =
    "PDF created successfully!";

}


function readFile(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
            new FileReader();

            reader.onload =
            () => resolve(reader.result);

            reader.onerror =
            reject;

            reader.readAsDataURL(file);

        }
    );

}


function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
            new Image();

            img.onload =
            () => resolve(img);

            img.onerror =
            reject;

            img.src =
            src;

        }
    );

}

</script>
