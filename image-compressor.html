<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Compressor - FreeDocTools</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    .upload-box {
      margin: 20px 0;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
    }

    .target-box {
      margin: 20px 0;
    }

    .target-box input {
      width: 120px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }

    .target-box select {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-left: 5px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 25px;
    }

    img {
      max-width: 100%;
      max-height: 350px;
      margin-top: 15px;
      border-radius: 8px;
    }

    .download-btn {
      display: inline-block;
      margin-top: 15px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 6px;
    }

    .info {
      font-size: 14px;
      color: #555;
      margin-top: 15px;
      line-height: 1.5;
    }

    .error {
      color: #dc2626;
      margin-top: 15px;
    }

    .success {
      color: #15803d;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Compressor</h1>

    <p>Compress your image to a target file size.</p>

    <div class="upload-box">
      <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
    </div>

    <div class="target-box">

      <h3>Target Size</h3>

      <input
        type="number"
        id="targetSize"
        placeholder="100"
        min="1"
        step="1"
      >

      <select id="sizeUnit">
        <option value="KB">KB</option>
        <option value="MB">MB</option>
      </select>

    </div>

    <button onclick="compressImage()">Compress Image</button>

    <div id="result"></div>

    <p class="info">
      Your image is processed directly in your browser.
      It is not uploaded to our server.
    </p>

  </div>


  <script>

    let originalFile = null;
    let originalImage = null;


    document.getElementById("imageInput").addEventListener("change", function(event) {

      originalFile = event.target.files[0];

      if (!originalFile) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {

        originalImage = new Image();

        originalImage.onload = function() {
          console.log("Image loaded");
        };

        originalImage.src = e.target.result;

      };

      reader.readAsDataURL(originalFile);

    });


    function compressImage() {

      const result = document.getElementById("result");

      result.innerHTML = "";

      if (!originalFile || !originalImage) {
        result.innerHTML =
          '<p class="error">Please select an image first.</p>';
        return;
      }


      const targetValue =
        parseFloat(document.getElementById("targetSize").value);

      const unit =
        document.getElementById("sizeUnit").value;


      if (!targetValue || targetValue <= 0) {

        result.innerHTML =
          '<p class="error">Please enter a valid target size.</p>';

        return;
      }


      let targetBytes;

      if (unit === "KB") {
        targetBytes = targetValue * 1024;
      } else {
        targetBytes = targetValue * 1024 * 1024;
      }


      const canvas = document.createElement("canvas");

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
      );


      let low = 0.05;
      let high = 1.0;

      let bestBlob = null;
      let bestDifference = Infinity;

      let attempts = 0;


      function tryCompression() {

        attempts++;

        const quality = (low + high) / 2;


        canvas.toBlob(function(blob) {

          if (!blob) {

            result.innerHTML =
              '<p class="error">Compression failed. Please try another image.</p>';

            return;
          }


          const difference =
            Math.abs(blob.size - targetBytes);


          if (difference < bestDifference) {

            bestDifference = difference;
            bestBlob = blob;

          }


          if (blob.size > targetBytes) {

            high = quality;

          } else {

            low = quality;

          }


          if (attempts < 12 && high - low > 0.01) {

            setTimeout(tryCompression, 20);

          } else {

            showResult(bestBlob);

          }

        }, "image/jpeg", quality);

      }


      tryCompression();


      function showResult(blob) {

        const compressedSizeKB =
          (blob.size / 1024).toFixed(2);

        const originalSizeKB =
          (originalFile.size / 1024).toFixed(2);


        const reduction =
          ((1 - blob.size / originalFile.size) * 100).toFixed(1);


        const url =
          URL.createObjectURL(blob);


        result.innerHTML = `

          <h3>Compression Complete</h3>

          <p>
            Original Size:
            <strong>${originalSizeKB} KB</strong>
          </p>

          <p>
            Compressed Size:
            <strong>${compressedSizeKB} KB</strong>
          </p>

          <p>
            Size Reduction:
            <strong>${reduction}%</strong>
          </p>

          <img src="${url}" alt="Compressed Image">

          <br>

          <a
            class="download-btn"
            href="${url}"
            download="compressed-image.jpg"
          >
            Download Compressed Image
          </a>

          <p class="info">
            Target size: ${targetValue} ${unit}
          </p>

        `;

      }

    }

  </script>

</body>
</html>
